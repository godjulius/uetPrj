<div class="p-4 border rounded shadow dark:border-gray-700">
    <h2 class="text-lg font-semibold mb-3 text-gray-900 dark:text-gray-100">Course Notes</h2>

    <div class="mb-2">
        <textarea
            pTextarea
            [(ngModel)]="noteText"
            class="w-full p-2 border rounded mb-2 text-gray-900 dark:text-gray-100 border-gray-300 dark:border-gray-700 placeholder-gray-400 dark:placeholder-gray-500"
            rows="2"
            placeholder="Type your note here..."
            (focus)="pauseVideo.emit()"
        ></textarea>
        <button
            pButton
            pRipple
            (click)="addNote()"
            class="bg-blue-500 text-white px-4 py-1 rounded hover:bg-blue-600 dark:hover:bg-blue-400 dark:bg-blue-600"
        >
            Add Note
        </button>
    </div>

    <ul class="mt-4 space-y-4">
        <li
            *ngFor="let note of notes; let i = index"
            [ngClass]="{
                'border-b pb-4 border-gray-200 dark:border-gray-600': i < notes.length - 1
            }"
            class="flex justify-between gap-2 items-start text-gray-900 dark:text-gray-100"
        >
            <!-- Time Section -->
            <div
                class="cursor-pointer"
                (click)="goToNote(note.time)"
            >
                <div
                    class="text-sm bg-black text-white dark:bg-white dark:text-black px-2 py-0.5 rounded-full font-semibold">
                    {{ formatTime(note.time) }}
                </div>
            </div>

            <!-- Note Content Section -->
            <div class="flex justify-between flex-1 gap-2">
                <div class="text-gray-700 dark:text-gray-300 flex-1 flex flex-col">
                    <div class="flex justify-between">
                        <!-- Section & Lesson Name -->
                        <div class="cursor-pointer" (click)="goToNote(note.time)">
                            <span class="text-base font-bold mr-2">
                                1. Introduction to Angular
                            </span>
                            <span class="text-sm">
                                1. Angular for Beginners - Helicopter View
                            </span>
                        </div>

                        <!-- Edit and Delete Buttons -->
                        <div class="flex gap-2">
                            <button
                                pRipple
                                type="button"
                                class="px-2 rounded-full transition-all duration-200 hover:bg-yellow-100 dark:hover:bg-yellow-900"
                                (click)="editNote(i)"
                                title="Edit"
                            >
                                <i class="pi pi-pencil text-yellow-600 dark:text-yellow-400 text-base"
                                   style="font-size: 1rem"></i>
                            </button>

                            <button
                                pRipple
                                type="button"
                                class="px-2 rounded-full transition-all duration-200 hover:bg-red-100 dark:hover:bg-red-900"
                                (click)="deleteNote(i)"
                                title="Delete"
                            >
                                <i class="pi pi-trash text-red-600 dark:text-red-400 text-base"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Note Text Section -->
                    <div class="text-sm text-gray-800 dark:text-gray-200 bg-gray-100 dark:bg-gray-800 p-4 rounded mt-4">
                        {{ note.text }}
                    </div>
                </div>
            </div>
        </li>
    </ul>
</div>
